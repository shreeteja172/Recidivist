services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recidivist
      POSTGRES_PASSWORD: recidivist
      POSTGRES_DB: recidivist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recidivist"]
      interval: 5s
      timeout: 3s
      retries: 10

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    shm_size: 1g
    ports:
      - "8888:8888" # API
      - "9999:9999" # Web UI (control plane)
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-5-mini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-}
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  pgdata:
  hindsight-data:
